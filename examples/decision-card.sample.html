<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>省吃决策卡</title>
<style>
:root { color-scheme: light; }
body { margin: 0; background: #f6f1e8; color: #241c15; font: 16px/1.5 "PingFang SC", "Noto Sans SC", sans-serif; }
main { max-width: 440px; margin: 24px auto; padding: 24px; background: #fffaf3; border: 1px solid #e6d7c3; border-radius: 18px; }
h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: .04em; }
.sample, .note { color: #8a5a12; }
.payable { margin: 18px 0; font-size: 42px; font-weight: 750; color: #da291c; }
dl { display: grid; grid-template-columns: 92px 1fr; gap: 8px 12px; margin: 16px 0; }
dt { color: #6d6258; }
dd { margin: 0; }
ul { padding-left: 18px; }
</style>
</head>
<body>
<main>
  <p class="sample">脱敏样例 · 不能当作今日报价</p>
  <h1>省吃</h1>
  <p>账户券和活动文案价，都不是可下单价。</p>
  <p class="payable">¥26.90</p>
  <dl>
    <dt>门店</dt><dd>麦当劳（示例广场店）</dd>
    <dt>渠道</dt><dd>到店自取</dd>
    <dt>候选</dt><dd>示例辣味鸡腿堡套餐</dd>
    <dt>菜单价</dt><dd>菜单现价 ¥29.90 · 不依赖随单购</dd>
    <dt>热量</dt><dd>热量未精确命中</dd>
    <dt>门店券</dt><dd>本店可用</dd>
  </dl>
  <h2>不能直接相信</h2>
  <ul><li><strong>活动文案价，不能下单</strong>：活动页写着 19.9 元，但这是文案价</li><li><strong>账户券，不证明本店可用</strong>：账户里有早餐券，不代表这家店现在可用</li></ul>
  <p class="note">确认前不领券、不下单、不支付。样例数据，不是当前门店报价</p>
</main>
</body>
</html>
